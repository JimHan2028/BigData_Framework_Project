input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["orders"]
    group_id => "logstash-hdfs"
    codec => json
    consumer_threads => 3
    auto_offset_reset => "earliest"
  }
}

filter {
  if ![price] {
    mutate { add_field => { "price" => "0" } }
  }
  if ![quantity] {
    mutate { add_field => { "quantity" => 0 } }
  }
  if ![amount] {
    ruby {
      code => "event.set('amount', event.get('price').to_f * event.get('quantity').to_i)"
    }
  }

  
  date {
    match => ["order_time", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => []
  }

  grok{
    match => { "order_time" => "(?<dt>%{YEAR}-%{MONTHNUM}-%{MONTHDAY})T(?<hour>%{HOUR})" }
  }
}

output {
  webhdfs {
    host => "namenode"
    port => 9870
    user => "root"
    path => "/data/orders/dt=%{[dt]}/orders-%{[hour]}.csv"
    codec => line {
      format => "%{order_id},%{user_id},%{product_id},%{category},%{price},%{quantity},%{amount},%{order_time},%{status}"
    }
    flush_size => 10
    idle_flush_time => 5
    retry_interval => 5
  }
}
