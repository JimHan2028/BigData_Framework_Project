input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["orders"]
    group_id => "logstash-es"
    codec => json
    consumer_threads => 3
    auto_offset_reset => "earliest"
    decorate_events => false
  }
}

filter {
  if ![price] {
    mutate { add_field => { "price" => "0" } }
  }
  if ![quantity] {
    mutate { add_field => { "quantity" => 0 } }
  }
  if ![amount] {
    ruby {
      code => "event.set('amount', event.get('price').to_f * event.get('quantity').to_i)"
    }
  }
  mutate {
    convert => { "price" => "float" "amount" => "float" "quantity" => "integer" }
    # 注意：@timestamp 必须保留，索引名 orders-%{+YYYY.MM.dd} 靠它取日期。
    # 删掉它索引名会退化成 "orders-"，日期滚动就失效了。
    remove_field => ["@version", "host", "event"]
  }

  # ---- 关键：用业务时间 order_time 覆盖 @timestamp ----
  # 不加这一条，@timestamp 只是 Logstash 的接收时间，Kibana 时间轴上显示的是"什么时候入库"
  # 而不是"什么时候下单"；补历史数据时两者能差好几天。
  # 下面 output 的索引名 orders-%{+YYYY.MM.dd} 也是从 @timestamp 取日期的，
  # 取成 UTC 会让索引名比北京时间早 8 小时：北京时间 0 点~8 点的订单落到"前一天"的索引，
  # Kibana 在"今天"的索引里查不到当天凌晨的数据。
  # 容器已设 TZ=Asia/Shanghai，date 解析出瞬时时间后按东八区格式化，索引日期才是对的。
  date {
    match => ["order_time", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orders-%{+YYYY.MM.dd}"
    document_id => "%{order_id}"
    # ---- 企业做法：显式索引模板，禁止 ES 自动推断字段类型 ----
    manage_template => true
    template_name => "orders"
    template => "/usr/share/logstash/template/orders-template.json"
    template_overwrite => true
    # 注意：flush_size / idle_flush_time 在 Logstash 7.17 的 elasticsearch output 中已被移除，
    # 写在这里会让整条 pipeline 配置失败（Unknown setting）。批量行为改由 logstash.yml 的
    # pipeline.batch.size（默认 125）与 pipeline.batch.delay（默认 50ms）控制。
  }
}
